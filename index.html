<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <!-- Top Title -->
        <header class="page-header">
            <h1>User Profiles</h1>
            <p>Add a new profile using the form below or browse existing demo users.</p>
        </header>

        <!-- Profile Input Form -->
        <section class="form-card">
            <h2>Add New User</h2>
            <p class="form-subtitle">Fill out the details below to create a new user profile.</p>

            <form id="userForm" class="user-form">
                <!-- Name -->
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="e.g. John Doe" required>
                </div>

                <!-- Role -->
                <div class="form-group">
                    <label for="role">Role / Designation</label>
                    <input type="text" id="role" name="role" placeholder="e.g. Frontend Developer" required>
                </div>

                <!-- Photo URL -->
                <div class="form-group full-width">
                    <label for="photo">Photo URL</label>
                    <input type="url" id="photo" name="photo" placeholder="e.g. https://images.unsplash.com/photo-..."
                        required>
                </div>

                <!-- Bio -->
                <div class="form-group full-width">
                    <label for="bio">Bio</label>
                    <textarea id="bio" name="bio" rows="3" placeholder="Write a brief introduction or bio..."
                        required></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn">Add User</button>
            </form>
        </section>

        <!-- Demo Users Section -->
        <section class="users-section">

            <div id="usersContainer" class="users-grid">







            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>

</html>

</html>
